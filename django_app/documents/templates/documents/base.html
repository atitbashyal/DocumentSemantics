<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Semantics MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f7fb; color: #222; }
    .container { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .nav { background: #1f2a44; color: #fff; padding: 16px 24px; }
    .nav a { color: #fff; text-decoration: none; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .card h2, .card h3 { margin-top: 0; }
    .muted { color: #666; }
    .small { font-size: 0.92rem; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input[type="text"], input[type="number"], input[type="file"], select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-top: 6px; border: 1px solid #cfd6e4; border-radius: 8px; }
    button { background: #284bce; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button.secondary { background: #4b5563; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid #e9edf4; padding: 10px 8px; vertical-align: top; }
    code, pre { background: #f3f5fa; border-radius: 8px; }
    pre { padding: 12px; overflow-x: auto; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; }
    .badge.ready { background: #d8f5e3; color: #146c2e; }
    .badge.failed { background: #ffe2e2; color: #9b1c1c; }
    .badge.pending { background: #fff3d6; color: #8a5a00; }
    .messages { list-style: none; padding: 0; }
    .messages li { background: #eef4ff; border-left: 4px solid #284bce; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
    .error { color: #9b1c1c; font-weight: 600; }
    .result-grid { display: grid; gap: 12px; }
    .result-box { padding: 14px; border: 1px solid #dde3ef; border-radius: 10px; background: #fbfcff; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="nav"><a href="{% url 'documents:list' %}">Document Semantics MVP</a></div>
  <div class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
